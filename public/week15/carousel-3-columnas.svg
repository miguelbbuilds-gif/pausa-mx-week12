  <rect x="64" y="700" width="360" height="64" rx="32" fill="#0f766e"/>
  <text x="92" y="742" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="26">Prueba una compra</text>
  <text x="64" y="840" fill="#5b6776" font-family="Segoe UI, Arial, sans-serif" font-size="22">Pieza 3 de 4 · Carrusel</text>
  
  <rect x="40" y="900" width="1000" height="132" rx="18" fill="#f8ecd4"/><text x="64" y="936" fill="#8a5a12" font-family="Segoe UI, Arial, sans-serif" font-size="20">PAUSA MX calcula únicamente con los datos que ingresas.</text><text x="64" y="964" fill="#8a5a12" font-family="Segoe UI, Arial, sans-serif" font-size="20">No verifica que hayas incluido todas tus obligaciones.</text><text x="64" y="992" fill="#8a5a12" font-family="Segoe UI, Arial, sans-serif" font-size="20">El resultado no determina si una compra es asequible para ti.</text>
